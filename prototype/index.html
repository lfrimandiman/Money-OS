<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Money OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===========================================================================
   MONEY OS — interactive trial (fictional data)
   Layout: one phone-width column. Sticky top bar + fixed bottom tab bar;
   every picker, form and explainer opens as a stacked bottom sheet.
   Palette: cream ground, black ink, red accent [USER Oct 25]; the validated
   6-hue account palette stays for accounts only. Type: Plus Jakarta Sans for the app,
   IBM Plex Mono for ledger/reconciliation rows.
   =========================================================================== */
:root{
  /* shell */
  --ground:#F3ECDF; --card:#FBF7EF; --ink:#161312; --soft:#6B625A; --line:#E2D8C6;
  --track:#EAE1D0; --accent:#B1261C; --ctaText:#FBF7EF;
  /* status — always paired with a symbol + words, never colour alone */
  --good:#2F6A45; --warn:#8A5A0B; --bad:#A3221A;
  --goodBg:#E3EBDD; --warnBg:#F3E6CC; --badBg:#F6DED8;
  /* account hues — dataviz categorical slots 1-6, validated light + dark */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  /* type */
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* motion — one easing, three durations */
  --ease:cubic-bezier(0.32,0.72,0,1); --t-quick:150ms; --t-std:450ms; --t-hero:550ms;
  --shadow:0 10px 30px rgba(22,19,18,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#141110; --card:#1E1A18; --ink:#F3EBDD; --soft:#A89E92; --line:#332C28;
  --track:#2A2421; --accent:#E8584B; --ctaText:#141110;
  --good:#7CC08F; --warn:#D9A443; --bad:#EF7B6E;
  --goodBg:#1D2A20; --warnBg:#33290F; --badBg:#3A1D19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#141110; --card:#1E1A18; --ink:#F3EBDD; --soft:#A89E92; --line:#332C28;
  --track:#2A2421; --accent:#E8584B; --ctaText:#141110;
  --good:#7CC08F; --warn:#D9A443; --bad:#EF7B6E;
  --goodBg:#1D2A20; --warnBg:#33290F; --badBg:#3A1D19;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ground);z-index:30}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px}
h3{font-size:15px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- frame ---------------------------------------------------------------- */
.wrap{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground)}
.topin{display:flex;align-items:center;gap:10px;min-height:52px;padding-block:6px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;flex:none;color:var(--accent)}
.today{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--soft);white-space:nowrap}
.sample{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--warn);background:var(--warnBg);border-radius:999px;padding:4px 9px;white-space:nowrap}
.clockbtn{margin-left:auto;display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap}
main{padding-block:4px 112px;display:grid;gap:14px}

/* ---- cards & bits --------------------------------------------------------- */
.c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.c.tight{padding:14px}
.k{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.sm{font-size:12.5px;color:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row>span:first-child{min-width:0}
.stack{display:grid;gap:12px}
.stack8{display:grid;gap:8px}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--track);color:var(--soft);white-space:nowrap}
.pill.good{background:var(--goodBg);color:var(--good)}
.pill.warn{background:var(--warnBg);color:var(--warn)}
.pill.bad{background:var(--badBg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border:0;border-radius:16px;background:var(--ink);color:var(--ctaText);font-size:16px;font-weight:700;padding:0 16px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px;width:auto;padding:0 14px}
.btn.danger{background:var(--badBg);color:var(--bad);border:1.5px solid var(--bad)}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;padding:0;min-height:36px;font-weight:700;font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.tapcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}

/* ---- hero ---------------------------------------------------------------- */
.hero{display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--track);border-radius:14px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:11px;background:none;font-size:13px;font-weight:600;color:var(--soft);transition:background var(--t-quick) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(22,19,18,.12)}
.heroflex{display:flex;align-items:center;gap:14px}
.heronum{flex:1;min-width:0;display:grid;gap:2px}
.big{font-size:32px;font-weight:700;line-height:1.08;letter-spacing:-.02em}
.mid{font-size:17px;font-weight:700;line-height:1.2}
.ring{flex:none;position:relative;width:132px;height:132px}
.ring svg{display:block;width:132px;height:132px;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:1px;padding:0 14px}
.ring .ctr .v{font-size:15px;font-weight:700;line-height:1.1}
.ring .ctr .l{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.legend{display:grid;gap:1px}
.lrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 6px;min-height:44px}
.lrow:hover{background:var(--track)}
.sw{flex:none;width:11px;height:11px;border-radius:3px}
.lname{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lshare{flex:none;font-size:11.5px;color:var(--soft);width:34px;text-align:right}
.lamt{flex:none;font-size:14px;font-weight:700}

/* ---- meters -------------------------------------------------------------- */
.meter{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--ink);transition:width var(--t-std) var(--ease)}
.meter.warn i{background:var(--warn)}
.meter.bad i{background:var(--bad)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center}
.barrow .bl{font-size:12.5px;color:var(--soft);font-weight:600}
.bartrack{height:20px;background:var(--track);border-radius:4px;overflow:hidden;min-width:0}
.bartrack i{display:block;height:100%;border-radius:0 4px 4px 0;transition:width var(--t-std) var(--ease)}
.barrow .bv{font-size:13.5px;font-weight:700}
.jar{flex:none;width:52px;height:64px;position:relative}
.jar svg{display:block}

/* ---- lists ---------------------------------------------------------------- */
.item{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:9px 4px;min-height:52px}
.item:hover{background:var(--track)}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--track);font-size:13px;font-weight:700;color:var(--soft)}
.ic.in{background:var(--goodBg);color:var(--good)}
.ic.out{background:var(--track);color:var(--ink)}
.ic.mv{background:var(--track);color:var(--soft)}
.itxt{min-width:0;display:grid;gap:1px}
.it1{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it2{font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iamt{text-align:right;font-size:14.5px;font-weight:700;white-space:nowrap}
.iamt.in{color:var(--good)}
.iamt small{display:block;font-size:11px;font-weight:600;color:var(--soft)}
.daybar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 4px 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);background:var(--ground);z-index:5}
.daybar .dd{font-size:13px;font-weight:700}
.daybar .dt{font-size:12px;color:var(--soft);font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ctaText);border-color:var(--ink);font-weight:700}
.nodaychip{display:inline-flex;align-items:center;gap:4px;min-height:44px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav button{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.empty{display:grid;gap:8px;padding:26px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:20px;color:var(--soft)}

/* ---- tab bar + fab -------------------------------------------------------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabin{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:grid;gap:3px;justify-items:center;min-height:56px;align-content:center;border:0;background:none;font-size:10.5px;font-weight:600;color:var(--soft);border-radius:14px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab .ti{display:grid;place-items:center;height:22px}
.ico{display:block;flex:none}
.ic .ico{margin:auto}
.fab{display:grid;place-items:center;justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--ink);color:var(--ctaText);border:0;font-size:24px;font-weight:400;line-height:1;box-shadow:var(--shadow)}

/* ---- sheets -------------------------------------------------------------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,17,16,.4);opacity:0;transition:opacity var(--t-std) var(--ease)}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:min(92vh,860px);display:grid;grid-template-rows:auto 1fr;background:var(--card);border-radius:26px 26px 0 0;box-shadow:var(--shadow);transform:translateY(100%);transition:transform var(--t-std) var(--ease)}
.sheet.in{transform:none}
.sheet.deep{transform:translateY(100%) scale(1)}
.shead{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;min-width:0;font-size:17px}
.sx{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.sbody{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sin>*{min-width:0;max-width:100%}
.sin{max-width:440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0;padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---- ledger (the inspectable maths) --------------------------------------- */
.ledger{font-family:var(--mono);font-size:12.5px;display:grid;gap:0;min-width:0;overflow-wrap:anywhere;background:var(--ground);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.lg{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 0;align-items:baseline}
.lg>span{min-width:0;overflow-wrap:anywhere}
.lg+.lg{border-top:1px dashed var(--line)}
.lg.tot{border-top:2px solid var(--ink);font-weight:500;font-size:13.5px;margin-top:4px;padding-top:8px}
.lg .op{color:var(--soft)}
.lg b{font-weight:500;white-space:nowrap}
.lg.neg b{color:var(--bad)}

/* ---- forms --------------------------------------------------------------- */
label.f{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
label.f>*{min-width:0}
.flab{font-size:12.5px;font-weight:700;color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req{color:var(--bad);font-weight:700}
.inp{min-height:52px;width:100%;min-width:0;padding:0 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
textarea.inp{min-height:76px;padding:12px 14px;resize:vertical;line-height:1.4}
.amtbox{display:flex;align-items:center;gap:8px;min-width:0;border:1.5px solid var(--line);border-radius:17px;background:var(--card);padding:0 16px;min-height:66px}
.amtbox span{font-size:26px;font-weight:700;color:var(--soft)}
.amtbox input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:30px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.amtbox:focus-within{border-color:var(--accent)}
.dayf{display:grid;gap:6px;min-width:0}
.daychips{display:flex;flex-wrap:wrap;gap:7px}
.daychips .chip{min-height:44px;display:inline-flex;align-items:center;gap:4px}
.picker{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;width:100%;min-width:0;padding:0 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--card);text-align:left;font-size:15px}
.picker .pv{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker .pv.ph{color:var(--soft);font-weight:400}
.picker.set{border-color:var(--ink)}
.scan{border:1.5px solid var(--line);background:var(--card);border-radius:15px;padding:3px 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.opt{display:flex;align-items:center;gap:11px;width:100%;min-height:52px;padding:8px 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--card);text-align:left;font-size:15px;font-weight:500}
.opt[aria-checked="true"]{border-color:var(--ink);border-width:2px;background:var(--track);font-weight:700}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt[aria-checked="true"] .mk{border-color:var(--ink);background:var(--ink);color:var(--ctaText)}
.opt .os{margin-left:auto;font-size:12px;color:var(--soft);font-weight:600;white-space:nowrap}
.srow{display:flex;align-items:center;gap:11px;width:100%;min-height:50px;padding:8px 18px;border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left;font-size:15px}
.srow[aria-checked="true"]{background:var(--track);font-weight:700}
.srow .sub{font-size:11.5px;color:var(--soft);font-weight:500}
.seglist{display:grid;gap:8px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;background:none;border:0;border-top:1px solid var(--line);padding:4px 0;text-align:left;font-size:14.5px}
.knob{flex:none;width:46px;height:28px;border-radius:14px;background:var(--track);border:1.5px solid var(--line);position:relative}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--soft);transition:transform var(--t-quick) var(--ease),background var(--t-quick) var(--ease)}
[aria-checked="true"]>.knob{background:var(--ink);border-color:var(--ink)}
[aria-checked="true"]>.knob::after{transform:translateX(18px);background:var(--card)}
.note{display:grid;gap:5px;min-width:0;overflow-wrap:anywhere;border-radius:15px;padding:12px 14px;font-size:13px;background:var(--track)}
.note.warn{background:var(--warnBg);color:var(--warn)}
.note.bad{background:var(--badBg);color:var(--bad)}
.note.good{background:var(--goodBg);color:var(--good)}
.tone-good{color:var(--good)}
.tone-warn{color:var(--warn)}
.tone-bad{color:var(--bad)}
.note b{font-weight:700}
.steps{display:grid;gap:9px;counter-reset:s}
.step{display:grid;grid-template-columns:26px 1fr;gap:11px;font-size:14px}
.step::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--soft)}
.step b{font-weight:700}
code{font-family:var(--mono);font-size:12.5px;background:var(--track);border-radius:6px;padding:1px 5px}

/* ---- receipt demo -------------------------------------------------------- */
.receipt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;justify-items:center}
.receipt svg{width:100%;max-width:230px;height:auto}
.scanning{position:relative;overflow:hidden;border-radius:12px}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 16px 3px var(--accent);animation:sweep 1.1s var(--ease) infinite}
@keyframes sweep{0%{top:2%}100%{top:96%}}

/* ---- scenarios ----------------------------------------------------------- */
.sc{display:grid;gap:9px;border:1px solid var(--line);border-radius:18px;padding:13px 14px;background:var(--card)}
.sch{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.scn{width:26px;height:26px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--soft);flex:none}
.sc.pass .scn{background:var(--goodBg);color:var(--good)}
.sc.fail .scn{background:var(--badBg);color:var(--bad)}
.sct{font-size:14px;font-weight:600}
.scout{font-family:var(--mono);font-size:11.5px;display:grid;gap:3px;overflow-wrap:anywhere;background:var(--ground);border-radius:12px;padding:10px 12px;color:var(--soft)}
.scout b{color:var(--ink);font-weight:500}

/* ---- toast --------------------------------------------------------------- */
#toast{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;justify-items:center;pointer-events:none;padding-inline:16px}
.toast{max-width:400px;background:var(--ink);color:var(--ctaText);border-radius:16px;padding:12px 16px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:opacity var(--t-std) var(--ease),transform var(--t-std) var(--ease)}
.toast.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){

let S = load();

    const raw = localStorage.getItem(KEY);

}

const isReal = () => S.mode === "real";

/* ===========================================================================
   2. HELPERS — dates, money, categories
   =========================================================================== */
const MONTHS = ["January","February","March","April","May","June","July",
  "August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const d2 = n => String(n).padStart(2,"0");
const dt = iso => new Date(iso + "T00:00:00Z");
const dayOf = iso => +iso.slice(8,10);
const monthLabel = ym => MONTHS[+ym.slice(5,7)-1] + " " + ym.slice(0,4);
const weekdayOf = iso => DAYS[dt(iso).getUTCDay()];
const daysInMonth = ym => new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7), 0)).getUTCDate();
function addDays(iso, n){ const d = dt(iso); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function addMonths(ym, n){
  let y = +ym.slice(0,4), m = +ym.slice(5,7) - 1 + n;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y + "-" + d2(m+1);
}
const dateLabel = iso => weekdayOf(iso) + ", " + MONTHS[+iso.slice(5,7)-1].slice(0,3) + " " + dayOf(iso);
const r2 = n => Math.round(n*100)/100;
function fmt(n){
  const v = r2(Math.abs(n));
  const s = v.toLocaleString("en-US",{minimumFractionDigits: Number.isInteger(v)?0:2, maximumFractionDigits:2});
  return (n < 0 ? "−" : "") + s;
}
const peso = n => "₱" + fmt(n);
/* signed display: the sign is written once, by the caller */
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + peso(Math.abs(n));
/* Summary figures round to the peso; ledgers, entry rows and forms keep centavos. */
const pesoR = n => "₱" + fmt(Math.round(n));
const signedR = n => { const v = Math.round(n); return (v > 0 ? "+" : v < 0 ? "−" : "") + pesoR(Math.abs(v)); };
const pct = f => Math.round(f*100) + "%";
const round100 = n => Math.round(n/100)*100;

/* Line icons — 24 grid, stroke 2, currentColor. Status symbols (✓ ◔ ! ?) stay text. */
const ICONS = {
  home:   '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/>',

const icon = (n, size) => `<svg class="ico" viewBox="0 0 24 24" width="${size||20}" height="${size||20}" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const acct = id => S.accounts.find(a => a.id === id);
const card = id => S.cards.find(c => c.id === id);
const nid = () => "t" + (S.nextId++);

const CATS = {

  "Food & Drinks":   ["Restaurant","Fast food","Coffee","Delivery"],

const BASE_MERCHANTS = {
  "Supermarket":["Puregold","SM Supermarket","Robinsons Supermarket"],
  "Wet market":["Palengke"], "Sari-sari store":["Aling Nena's"],
  "Restaurant":["Mang Inasal","Max's"], "Fast food":["Jollibee","McDonald's"],

  "Gifts":["Gift"], "Bank fees":["Bank fee"], "Misc":["Other"]

/* Merchant suggestions: recent + frequent first, then seeds, then anything added. */
function merchantsFor(type){
  const used = {};
  S.txns.forEach(t => {
    if(t.kind !== "expense" || t.type !== type || !t.merch) return;
    const k = t.merch;
    const when = t.date || (t.month + "-01");
    used[k] = used[k] || {n:0, last:""};
    used[k].n++;
    if(when > used[k].last) used[k].last = when;
  });
  const ranked = Object.keys(used).sort((a,b) =>
    used[b].n - used[a].n || (used[b].last > used[a].last ? 1 : -1) || a.localeCompare(b));
  const rest = (BASE_MERCHANTS[type] || []).concat(S.merchants[type] || [])
    .filter(m => !ranked.includes(m));
  return ranked.map(m => ({name:m, n:used[m].n, last:used[m].last}))
    .concat(rest.map(m => ({name:m, n:0, last:""})));
}

/* ===========================================================================
   3. CALC ENGINE — one pool, recomputed from scratch every render.
   =========================================================================== */
function applyTxn(b, t){
  if(t.kind === "expense"){
    if(t.pay === "card") b.cards[t.card] += t.amount;     // owed goes up
    else b.acc[t.acct] -= t.amount;
  } else if(t.kind === "income"){ b.acc[t.acct] += t.amount; }
  else if(t.kind === "transfer"){ b.acc[t.from] -= t.amount; b.acc[t.to] += t.amount; }
  else if(t.kind === "cardpay"){ b.acc[t.acct] -= t.amount; b.cards[t.card] -= t.amount; }
  else if(t.kind === "checkpoint"){ b.acc[t.acct] += t.amount; } // signed adjustment
}
/* Balances after every transaction up to and including month `upto` (all, if null). */
function balances(upto){
  const b = {acc:{}, cards:{}};
  S.accounts.forEach(a => b.acc[a.id] = a.open);
  S.cards.forEach(c => b.cards[c.id] = c.open);
  S.txns.forEach(t => { if(!upto || t.month <= upto) applyTxn(b, t); });
  return b;
}
const monthTxns = ym => S.txns.filter(t => t.month === ym);

function calc(){
  const ym = S.today.slice(0,7), day = dayOf(S.today), dim = daysInMonth(ym);
  const bal = balances(null);
  const prev = balances(addMonths(ym, -1));          // opening balances of this month

  const total        = S.accounts.reduce((s,a) => s + bal.acc[a.id], 0);
  const unprotected  = S.accounts.filter(a => !a.prot).reduce((s,a) => s + bal.acc[a.id], 0);
  const cardsOwed    = S.cards.reduce((s,c) => s + bal.cards[c.id], 0);

  const mt = monthTxns(ym);
  const spent  = mt.filter(t => t.kind === "expense").reduce((s,t) => s + t.amount, 0);
  const income = mt.filter(t => t.kind === "income").reduce((s,t) => s + t.amount, 0);

  const duesThisMonth = S.payables.filter(p => !p.paid && p.due.slice(0,7) === ym);
  const billsLeft = duesThisMonth.reduce((s,p) => s + (p.amount || 0), 0);
  const billsUnknown = duesThisMonth.filter(p => p.amount == null);

  const savedThisMonth = S.accounts.filter(a => a.save)
    .reduce((s,a) => s + (bal.acc[a.id] - prev.acc[a.id]), 0);
  // 25% of income received, never more than income received − bills due this month.
  // Spending and card purchases never move the cap, so a purchase always lowers
  // Spendable instead of quietly lowering the target [USER Oct 25].
  const billsDueMonth = S.payables.filter(p => p.due.slice(0,7) === ym && p.amount != null)
    .reduce((s,p) => s + p.amount, 0);
  const savingsCap = Math.max(0, income - billsDueMonth);
  const savingsTarget = S.savings.target != null ? S.savings.target
    : round100(Math.min(income * SAVE_RATE, savingsCap));
  const savingsLeft = Math.max(0, savingsTarget - savedThisMonth);

  // The pool. Every scenario in the brief falls out of this one line.
  const remaining = unprotected - billsLeft - cardsOwed - savingsLeft;
  const allowance = spent + remaining;
  const base = allowance / dim;

  // Carry jar: unspent base from every elapsed day of THIS month. Month-only
  // entries have no day, so they never touch a day's figure — only the pool.
  const spentOn = {};
  mt.forEach(t => { if(t.kind === "expense" && t.date) spentOn[dayOf(t.date)] = (spentOn[dayOf(t.date)]||0) + t.amount; });
  let jar = 0;
  for(let d = 1; d < day; d++) jar += base - (spentOn[d] || 0);
  const spentToday = spentOn[day] || 0;
  const todayAvail = Math.min(remaining, base + jar - spentToday);
  const daysLeft = dim - day + 1;
  const guide = daysLeft > 0 ? remaining / daysLeft : remaining;

  // Pace: share of the pool spent against share of the month passed (today counts).
  // Amber only when spending runs more than PACE_SLACK ahead; red when over the pool.
  const pace = day / dim;
  const spentShare = allowance > 0 ? spent / allowance : (spent > 0 ? 1 : 0);
  const status = remaining < 0 ? "bad" : spentShare > pace + PACE_SLACK ? "warn" : "good";

  return {ym, day, dim, daysLeft, bal, prev, total, unprotected, cardsOwed, spent, income, billsDueMonth, savingsCap,
    billsLeft, billsUnknown, duesThisMonth, savedThisMonth, savingsTarget, savingsLeft,
    remaining, allowance, base, jar, spentToday, todayAvail, guide, pace, spentShare, status};
}

/* ===========================================================================

   always present, so identity is never colour-alone.
   =========================================================================== */
function donut(parts, centreVal, centreLab){
  const R = 54, SW = 17, C = 2*Math.PI*R;
  const tot = parts.reduce((s,p) => s + p.v, 0);
  let off = 0, segs = "";
  if(tot <= 0){
    segs = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--track)" stroke-width="${SW}"></circle>`;
  } else {
    parts.forEach(p => {
      const len = Math.max(0, (p.v/tot)*C - 2);          // 2px gap in the surface colour
      segs += `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--s${p.slot})" stroke-width="${SW}"
        stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
      off += (p.v/tot)*C;
    });
  }
  return `<div class="ring"><svg viewBox="0 0 132 132" role="img" aria-label="${esc(centreLab)} ${esc(centreVal)}">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--track)" stroke-width="${SW}"></circle>${segs}
    </svg><div class="ctr"><span class="v num">${esc(centreVal)}</span><span class="l">${esc(centreLab)}</span></div></div>`;
}
function meter(frac, tone){
  const w = Math.max(0, Math.min(1, frac)) * 100;
  return `<div class="meter ${tone||""}"><i style="width:${w.toFixed(1)}%"></i></div>`;
}
/* Income vs expenses: one shared scale, 20px marks, value labels at the tips. */
function ioBars(income, expense){
  const max = Math.max(income, expense, 1);
  const row = (lab, v, colour) => `<div class="barrow">
      <span class="bl">${lab}</span>
      <div class="bartrack"><i style="width:${(v/max*100).toFixed(1)}%;background:${colour}"></i></div>
      <span class="bv num">${pesoR(v)}</span></div>`;
  return `<div class="bars">${row("In", income, "var(--ink)")}${row("Out", expense, "var(--soft)")}</div>`;
}
/* The carry jar — a restrained bit of motivation, not a savings claim. */
function jarSvg(frac){
  const f = Math.max(0, Math.min(1, frac)), h = 40*f, y = 54 - h;
  return `<div class="jar"><svg viewBox="0 0 52 64" width="52" height="64" aria-hidden="true">
    <rect x="13" y="2" width="26" height="7" rx="2.5" fill="none" stroke="var(--soft)" stroke-width="2"></rect>
    <path d="M8 12 h36 v38 a6 6 0 0 1-6 6 H14 a6 6 0 0 1-6-6 Z" fill="var(--track)" stroke="var(--soft)" stroke-width="2"></path>
    <clipPath id="jc"><path d="M9.5 13.5 h33 v36.5 a5 5 0 0 1-5 5 H14.5 a5 5 0 0 1-5-5 Z"></path></clipPath>
    <g clip-path="url(#jc)"><rect x="9" y="${y}" width="34" height="${h+6}" fill="var(--accent)"></rect></g>
  </svg></div>`;
}

function render(){

  document.getElementById("todaylbl").textContent = dateLabel(S.today);
  document.getElementById("samplepill").hidden = isReal();
  document.getElementById("todaylbl").hidden = !isReal();
  document.getElementById("clockbtn").hidden = isReal();
  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute("aria-current", b.dataset.screen === screenName ? "page" : "false"));
  const el = document.getElementById("screen");
  const prevHero = el.querySelector("#heronum");
  const before = prevHero ? prevHero.dataset.v : null;
  el.innerHTML = ({home:homeScreen, activity:activityScreen, savings:savingsScreen, more:moreScreen})[screenName]();
  const hero = el.querySelector("#heronum");
  if(hero && before != null && before !== hero.dataset.v) countUp(hero, +before, +hero.dataset.v);
  save();
}
function countUp(el, from, to){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 400;
  (function step(t){
    const p = Math.min(1, (t-t0)/dur), e = 1 - Math.pow(1-p, 3);
    el.textContent = pesoR(from + (to-from)*e);
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = pesoR(to);
  })(performance.now());
}

/* ---- shared transaction row ---------------------------------------------- */
function sortTxn(a, b){
  const ad = a.date || "", bd = b.date || "";
  if(ad !== bd) return ad < bd ? 1 : -1;     // newest dated first; undated last
  return a.id < b.id ? 1 : -1;
}
function txnTitle(t){
  if(t.kind === "expense") return t.merch || t.type || t.cat;
  if(t.kind === "income")  return t.src || "Income";
  if(t.kind === "transfer")return (t.note || "Transfer") ;
  if(t.kind === "cardpay") return "Card payment — " + card(t.card).name;
  if(t.kind === "checkpoint") return "Balance checkpoint — " + acct(t.acct).name;
  return "Entry";
}
function txnSub(t){
  if(t.kind === "expense") return [t.cat, t.type, t.pay === "card" ? card(t.card).name : acct(t.acct).name]
    .filter(Boolean).join(" · ");
  if(t.kind === "income")  return "Income · " + acct(t.acct).name;
  if(t.kind === "transfer")return "Transfer · " + acct(t.from).name + " → " + acct(t.to).name;
  if(t.kind === "cardpay") return "Paid from " + acct(t.acct).name + " · not an expense";
  if(t.kind === "checkpoint") return (t.amount >= 0 ? "Counted more than recorded" : "Counted less than recorded")
    + " · not an expense";
  return "";
}
function txnRow(t){
  const inflow = t.kind === "income";
  const neutral = t.kind === "transfer" || t.kind === "cardpay" || t.kind === "checkpoint";
  const sym = inflow ? "↓" : neutral ? "⇄" : "↑";
  return `<button class="item" data-act="txn" data-id="${t.id}">
    <span class="ic ${inflow ? "in" : neutral ? "mv" : "out"}">${sym}</span>
    <span class="itxt"><span class="it1">${esc(txnTitle(t))}</span><span class="it2">${esc(txnSub(t))}</span></span>
    <span class="iamt num ${inflow ? "in" : ""}">${t.kind === "checkpoint" ? signed(t.amount)
      : (inflow ? "+" : neutral ? "" : "−") + peso(t.amount)}
      ${t.date ? "" : '<small>month only</small>'}</span></button>`;
}

/* ---- ACTIVITY ------------------------------------------------------------ */
const FILTERS = [["all","All"],["expense","Expenses"],["income","Income"],
  ["transfer","Transfers"],["card","Card Activity"]];
function matchFilter(t){
  if(actFilter === "all") return true;
  if(actFilter === "card") return (t.kind === "expense" && t.pay === "card") || t.kind === "cardpay";
  if(actFilter === "transfer") return t.kind === "transfer" || t.kind === "checkpoint";
  return t.kind === actFilter;
}
function activityScreen(){
  const ym = actMonth || S.today.slice(0,7);
  const rows = monthTxns(ym).filter(matchFilter).sort(sortTxn);
  const dated = rows.filter(t => t.date), undated = rows.filter(t => !t.date);

  const dayTotal = list => list.reduce((s,t) =>
    s + (t.kind === "expense" ? -t.amount : t.kind === "income" ? t.amount : 0), 0);

  let groups = "", day = null, buf = [];
  const flush = () => {
    if(!buf.length) return;
    const net = dayTotal(buf);
    groups += `<div class="daybar"><span class="dd">${dateLabel(day)}</span>
      <span class="dt num">${Math.round(net) === 0 ? "no change" : signedR(net)}</span></div>
      <div class="c tight">${buf.map(txnRow).join("")}</div>`;
    buf = [];
  };
  dated.forEach(t => { if(t.date !== day){ flush(); day = t.date; } buf.push(t); });
  flush();

  if(undated.length){
    const net = dayTotal(undated);
    groups += `<div class="daybar" id="undated"><span class="dd">Date not specified</span>
      <span class="dt num">${Math.round(net) === 0 ? "no change" : signedR(net)}</span></div>
      <div class="c tight stack8"><p class="sm">Known only by month. Counted in ${monthLabel(ym)}
      totals and in the monthly allowance, with no day attributed.</p>
      ${undated.map(txnRow).join("")}</div>`;
  }
  if(!rows.length) groups = `<div class="empty"><b>Nothing here</b>
    <span class="sm">No ${actFilter === "all" ? "activity" : esc(FILTERS.find(f => f[0]===actFilter)[1].toLowerCase())}
    in ${monthLabel(ym)}.</span></div>`;

  const c = calc();
  const mIn  = monthTxns(ym).filter(t => t.kind === "income").reduce((s,t) => s+t.amount, 0);
  const mOut = monthTxns(ym).filter(t => t.kind === "expense").reduce((s,t) => s+t.amount, 0);

  return `
  <section class="c stack8">
    <div class="mnav">
      <button data-act="month" data-d="-1" aria-label="Previous month">${icon("left",18)}</button>
      <h2>${monthLabel(ym)}</h2>
      <button data-act="month" data-d="1" aria-label="Next month">${icon("right",18)}</button>
    </div>
    ${ioBars(mIn, mOut)}
    <div class="row"><span class="sm">${monthTxns(ym).length} entries</span>
      <span class="sm num">Net ${signedR(mIn - mOut)}</span></div>
    ${undated.length ? `<div><button class="chip nodaychip" data-act="jumpundated">${undated.length} with no day
      ${icon("down",14)}</button></div>` : ""}
  </section>
  <div class="chips" role="group" aria-label="Filter activity">
    ${FILTERS.map(([k,l]) => `<button class="chip" data-act="filter" data-v="${k}"
      aria-pressed="${actFilter === k}">${l}</button>`).join("")}
  </div>
  ${groups}`;
}

   6. SHEETS — every picker, form and explainer is a bottom sheet.
   =========================================================================== */
let stack = [];
function openSheet(spec){ stack.push(spec); paint(); }
function closeSheet(n){
  n = n || 1;
  while(n-- > 0 && stack.length){ const s = stack.pop(); if(s.onClose) s.onClose(); }
  paint();
}
function refresh(){ paint(); }
function paint(){
  const host = document.getElementById("sheets");
  if(!stack.length){ host.innerHTML = ""; document.body.style.overflow = ""; return; }
  const top = stack[stack.length-1];
  const scroll = host.querySelector(".sbody");
  const keep = scroll && host.dataset.key === top.key ? scroll.scrollTop : 0;
  host.dataset.key = top.key || "";
  host.innerHTML = `<div class="scrim" data-act="close"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(top.title)}">
      <div class="shead"><h2>${esc(top.title)}</h2>
        <button class="sx" data-act="close" aria-label="Close">${icon("close",18)}</button></div>
      <div class="sbody"><div class="sin">${top.body()}</div></div></section>`;
  host.querySelector(".sbody").scrollTop = keep;
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => {
    host.querySelector(".scrim").classList.add("in");
    host.querySelector(".sheet").classList.add("in");
  });
}
function toast(msg){
  const host = document.getElementById("toast");
  host.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  const el = host.firstChild;
  requestAnimationFrame(() => el.classList.add("in"));
  setTimeout(() => { el.classList.remove("in"); setTimeout(() => { if(host.firstChild === el) host.innerHTML = ""; }, 500); }, 3200);
}

      ${lg("Spendable, rest of the month", peso(c.remaining), "", "tot")}
    </div>
    <div class="ledger">

      ${lg("Already spent this month", peso(c.spent), "+")}
      ${lg(MONTHS[+c.ym.slice(5,7)-1] + " pool (allowance)", peso(c.allowance), "", "tot")}
    </div>
    <div class="ledger">
      ${lg("Base daily — pool ÷ " + c.dim + " days", peso(c.base), "")}
      ${lg("Carried from earlier days", peso(c.jar), c.jar < 0 ? "−" : "+", c.jar < 0 ? "neg" : "")}
      ${c.spentToday ? lg("Spent today", peso(c.spentToday), "−", "neg") : ""}
      ${lg("Today you can spend", peso(Math.max(0, c.todayAvail)), "", "tot")}

    <div class="ledger">

      ${lg("Allowed ahead of pace", "+" + Math.round(PACE_SLACK*100) + " points", "+")}
      ${lg("Amber above", pct(c.pace + PACE_SLACK), "", "tot")}
      ${lg("Share of the pool spent — " + peso(c.spent) + " of " + peso(c.allowance), pct(c.spentShare), "")}
      ${lg("Status", c.status === "bad" ? "! over pool" : c.status === "warn" ? "◔ ahead of pace" : "✓ on track", "", "tot")}
    </div>
    <p class="sm">On track while the share spent stays within ${Math.round(PACE_SLACK*100)} points of the share of
      the month gone. Spendable below zero is over the pool.</p>
    <div class="note"><b>How the savings target is set</b>

function fundingWarning(){
  if(draft.pay === "card" || !draft.amount) return null;
  const a = acct(draft.acct), have = balances(null).acc[draft.acct];
  const amt = +draft.amount;
  if(!(amt > have)) return null;
  return `<div class="note warn"><b>! Not enough in ${esc(a.name)}</b>
    <span>It holds ${peso(have)} and this is ${peso(amt)}. If it really happened, save it —

function effectStrip(){
  const amt = +draft.amount || 0;
  if(!amt) return "";
  const c = calc(), rows = [];
  if(draft.kind === "expense"){
    if(draft.pay === "card"){
      rows.push([card(draft.card).name + " owed", "+" + peso(amt)]);
      rows.push(["Set aside to pay it from " + acct(card(draft.card).payFrom).name, "+" + peso(amt)]);
      rows.push(["Bank balances", "no change until you pay the card"]);
    } else rows.push([acct(draft.acct).name, "−" + peso(amt)]);
    rows.push([MONTHS[+draft.month.slice(5,7)-1] + " expenses", "+" + peso(amt)]);
    rows.push(["Spendable, rest of month", peso(c.remaining) + " → " + peso(c.remaining - amt)]);
    if(draft.date === null) rows.push(["Daily carryover", "untouched — no day attributed"]);
  } else if(draft.kind === "income"){
    rows.push([acct(draft.acct).name, "+" + peso(amt)]);
    rows.push([MONTHS[+draft.month.slice(5,7)-1] + " income", "+" + peso(amt)]);
    rows.push(["Spendable, rest of month", peso(c.remaining) + " → " + peso(c.remaining + amt)]);
  } else if(draft.kind === "transfer"){
    rows.push([acct(draft.from).name, "−" + peso(amt)]);
    rows.push([acct(draft.to).name, "+" + peso(amt)]);
    const dp = acct(draft.from).prot, tp = acct(draft.to).prot;
    rows.push(["Total Balance", "no change — your own money moving"]);
    rows.push(["Expenses and income", "no change"]);
    if(dp !== tp) rows.push(["Spendable, rest of month",
      tp ? "goes down — money moves into a protected account" : "goes up — money leaves a protected account"]);
  } else if(draft.kind === "cardpay"){
    rows.push([acct(draft.acct).name, "−" + peso(amt)]);
    rows.push([card(draft.card).name + " owed", "−" + peso(amt)]);
    rows.push(["Amount set aside for that card", "−" + peso(amt) + " — released"]);
    rows.push(["Expenses this month", "no change — not a second expense"]);
  }
  return `<div class="ledger">${rows.map(r =>
    `<div class="lg"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("")}</div>`;
}

/* ---- snapshot for ChatGPT / Claude ---------------------------------------- */
/* Plain text, built from calc() like every other figure, so it can be pasted into
   any chat. Exact centavos throughout — it is a ledger, not a summary card. */
function aiSnapshot(withEntries){
  const c = calc(), mName = MONTHS[+c.ym.slice(5,7)-1];
  const L = [];
  const statusWord = c.status === "bad" ? "over pool" : c.status === "warn" ? "ahead of pace" : "on track";
  L.push("# Money OS snapshot — " + dateLabel(S.today) + ", " + S.today.slice(0,4));
  L.push(isReal() ? "Jordan's own figures, as logged in the app." : "SAMPLE DATA: every figure below is fictional trial data.", "");
  L.push("## How to read this",
    "- Currency PHP. Calendar months. Figures come from the app's one calculation:",
    "  Spendable = unprotected accounts − unpaid bills this month − card set-aside − savings still to put away.",
    "  Monthly pool = already spent this month + Spendable.",
    "- Expected income is never counted. A bill marked ? has no amount yet and is left out (unknown is not zero).",
    "- Own-account transfers are neither income nor expense. A card purchase is one expense; paying the card is not a second one.",
    "- Protected accounts are in Total Balance but not in Spendable.", "");
  L.push("## " + mName + " so far (day " + c.day + " of " + c.dim + ", " + c.daysLeft + " days left)",
    "- Total Balance: " + peso(c.total),
    "- Spendable, rest of month: " + peso(c.remaining),
    "- Monthly pool: " + peso(c.allowance) + " · spent " + peso(c.spent) + " (" + pct(c.spentShare) + " of pool, " + pct(c.pace) + " of month gone) · status: " + statusWord,
    "- Today you can spend: " + peso(Math.max(0, c.todayAvail)) + " · daily guide " + peso(c.guide),
    "- Income received this month: " + peso(c.income),
    "- Savings: saved " + peso(c.savedThisMonth) + " of a " + peso(c.savingsTarget) + " target (" + (S.savings.target != null ? "set by hand" : Math.round(SAVE_RATE*100) + "% of income received, capped at income − this month's bills") + "); still to put away " + peso(c.savingsLeft),
    "- Credit cards owed (not in Total Balance): " + peso(c.cardsOwed), "");
  L.push("## Accounts");
  S.accounts.forEach(a => L.push("- " + a.name + ": " + peso(c.bal.acc[a.id]) + " · " +
    (a.prot ? "protected" : "spendable") + (a.save ? " · counts as savings" : "")));
  L.push("", "## Cards");
  S.cards.forEach(k => L.push("- " + k.name + ": owes " + peso(c.bal.cards[k.id]) + " · due " + k.due + " · pay from " + acct(k.payFrom).name));
  L.push("", "## Bills");
  S.payables.slice().sort((a,b) => a.due < b.due ? -1 : 1).forEach(p => L.push("- " + p.name + ": " +
    (p.amount == null ? "? (" + (p.reason || "amount unknown") + ")" : peso(p.amount)) + " · due " + p.due + " · " + (p.paid ? "paid" : "unpaid")));
  if(withEntries === false) return L.join("\n");
  L.push("", "## Entries in " + monthLabel(c.ym) + " (newest first)");
  monthTxns(c.ym).slice().sort(sortTxn).forEach(t => {
    const amt = t.kind === "checkpoint" ? signed(t.amount) : peso(t.amount);
    L.push("- " + (t.date || "no day") + " · " + t.kind + " · " + amt + " · " + txnTitle(t) + " · " + txnSub(t) + (t.note ? " · note: " + t.note : ""));
  });
  return L.join("\n");
}
function aiSheet(){
  const text = aiSnapshot();
  openSheet({title:"Copy for ChatGPT / Claude", key:"ai", body:() => `

function finishSetup(){

    return {id, name:a.name.trim(), kind:a.kind, slot:(k % 6) + 1, open:r2(+a.bal || 0), save:!!a.save, prot:!!a.prot}; });
  const today = localToday();
  const cards = setup.cards.filter(k => k.name.trim()).map(k => ({id:"c" + (n++), name:k.name.trim(),
    open:r2(+k.owed || 0), payFrom:idOf[k.payFrom] || accounts[0].id, due:k.due || today}));
  const payables = setup.bills.filter(b => b.name.trim()).map(b => {
    const known = String(b.amount).trim() !== "";
    const p = {id:"p" + (n++), name:b.name.trim(), amount:known ? r2(+b.amount) : null, due:b.due || today, paid:false};
    if(!known) p.reason = "Amount not known yet";
    return p; });
  const g = setup.goal, target = r2(+g.target || 0);
  S = {mode:"real", today, primary:S.primary || "total", theme:S.theme, sheet:S.sheet || null,
    autoSync:S.autoSync !== false, accounts, cards, payables,
    savings:{mode:"general", target:null, goal:{name:g.name.trim() || "Savings goal", target:target > 0 ? target : 10000}},
    goalLog:[], merchants:{}, txns:[], nextId:n + 1};
  setup = null; save(); screenName = "home"; closeSheet(stack.length); render(); window.scrollTo(0,0);
  toast("You're live. Every figure now comes from your own accounts.");

}

/* The app writes the same figures to a Google Sheet Jordan owns, through his own
   claude.ai connectors. ChatGPT reads it with its Google Drive connector, Claude with
   Google Sheets — one source, both assistants. Writes happen only after he changes
   something or taps Update now, never on load. */
let syncMsg = {text:"", tone:""}, syncTimer = null;
const sheetUrl = id => "https://docs.google.com/spreadsheets/d/" + id;
function sheetIdFrom(text){
  const t = String(text || "").trim(), m = t.match(/\/d\/([A-Za-z0-9_-]{20,})/);
  return m ? m[1] : /^[A-Za-z0-9_-]{20,}$/.test(t) ? t : null;
}
async function mcpNS(){
  try{ return window.claude && window.claude.use ? await window.claude.use("mcp") : null; }catch(e){ return null; }
}
function setSync(text, tone){
  syncMsg = {text, tone:tone || ""};
  const el = document.getElementById("syncmsg");
  if(el){ el.textContent = text; el.className = "sm" + (tone ? " tone-" + tone : ""); }
}
function syncError(e, server){
  const code = e && e.code;
  if(code === "needs_reauth") return "! Reconnect " + server + " in claude.ai Settings → Connectors, then tap Update now.";
  if(code === "server_not_connected" || code === "server_not_found") return "! Add the " + server + " connector in claude.ai Settings → Connectors.";
  if(code === "selection_required") return "! Pick which " + server + " connector to use when Claude asks.";
  if(code === "not_in_manifest" || code === "approval_required" || code === "consent_required" || code === "not_granted")
    return "! " + server + " is not allowed for this app yet. Tap again and allow it when Claude asks.";
  if(code === "blocked_by_policy") return "! " + server + " is blocked here.";
  if(code === "server_unavailable" || code === "rate_limited" || code === "timeout") return "! " + server + " did not answer. Try again in a minute.";
  if(code === "tool_error") return "! " + server + " refused. Check the sheet still exists and you can edit it.";
  return "! Could not reach " + server + " (" + (code || "unknown") + "). Try again.";
}
/* Rows for the sheet: the snapshot text first (so either assistant reads the rules and
   the month), then every entry as a table with plain numbers. */
function sheetRows(){
  const rows = aiSnapshot(false).split("\n").map(l => [l]);
  rows.push([""], ["## All entries (newest first)"], ["Date", "Month", "Kind", "Amount", "Title", "Details", "Note"]);
  const key = t => t.date || t.month + "-00";
  S.txns.slice().sort((a,b) => key(a) < key(b) ? 1 : key(a) > key(b) ? -1 : 0).forEach(t =>
    rows.push([t.date || "no day", t.month, t.kind, t.amount, txnTitle(t) || "", txnSub(t) || "", t.note || ""]));
  return rows;
}
async function syncSheet(){
  if(!S.sheet) return;
  const mcp = await mcpNS();
  if(!mcp){ setSync("Open the app inside Claude to update the sheet.", "warn"); return; }
  setSync("Updating your sheet…");
  try{
    await mcp.callTool("Google Sheets", "batch_clear_values", {spreadsheetId:S.sheet.id, ranges:["A1:H5000"]});
    await mcp.callTool("Google Sheets", "update_values", {spreadsheetId:S.sheet.id, range:"A1", values:sheetRows()});
    S.sheet.last = new Date().toISOString(); save();
    setSync("✓ Sheet updated " + new Date(S.sheet.last).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) + ".", "good");
  }catch(e){ setSync(syncError(e, "Google Sheets"), "bad"); }
}
function scheduleSync(){
  if(!S.sheet || S.autoSync === false) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncSheet, 2000);
}
async function createSheet(){
  const mcp = await mcpNS();
  if(!mcp){ setSync("Open the app inside Claude to create the sheet.", "warn"); return; }
  setSync("Creating your sheet in Google Drive…");
  try{
    const r = await mcp.callTool("Google Drive", "create_file",
      {title:"Money OS — live data", contentMimeType:"application/vnd.google-apps.spreadsheet"});
    const p = (r && r.payload) || {}, f = p.file || p;
    const id = f.id || f.fileId || sheetIdFrom(f.webViewLink || f.alternateLink || "");
    if(!id){ setSync("! Drive did not say where the sheet is. Find “Money OS — live data” in Drive and paste its link below.", "bad"); return; }
    S.sheet = {id, url:f.webViewLink || f.alternateLink || sheetUrl(id)}; S.autoSync = true; save(); render();
    await syncSheet();
  }catch(e){ setSync(syncError(e, "Google Drive"), "bad"); }
}

function setupInput(e){
  const f = e.target.dataset && e.target.dataset.setup;
  if(!f || !setup) return;
  const i = +e.target.dataset.i, v = e.target.value, [grp, key] = f.split(".");
  if(grp === "acct"){
    const a = setup.accounts[i]; a[key] = v;
    if(e.type === "change" && key === "kind"){ a.prot = a.save = v === "savings"; refresh(); }
    else if(e.type === "change" && key === "name" && setup.cards.length && !pressing) refresh();   // Pay from lists follow names
  }
  else if(grp === "card") setup.cards[i][key] = key === "payFrom" ? +v : v;
  else if(grp === "bill") setup.bills[i][key] = v;
  else if(grp === "goal") setup.goal[key] = v;
}

    return {pass: offered && !!rec && rec.n === 1 && !leak,
      lines:[["Groceries → Supermarket", merchantsFor(type).slice(0,4).map(m => m.name).join(", ")],
        ["Food & Drinks → Coffee", merchantsFor("Coffee").slice(0,3).map(m => m.name).join(", ")],
        ["added merchant", name + " — offered straight away"],
        ["after using it once", "listed as " + rec.n + "× used, last " + rec.last],
        ["shown under another type?", leak ? "yes — wrong" : "no"]]};
  }},
  {n:9, t:"Activity shows the newest dated entries first, grouped by day", run(){
    const ym = S.today.slice(0,7);
    const rows = monthTxns(ym).slice().sort(sortTxn);
    const dated = rows.filter(t => t.date), und = rows.filter(t => !t.date);
    let desc = true;
    for(let i = 1; i < dated.length; i++) if(dated[i].date > dated[i-1].date) desc = false;
    const groups = [];
    dated.forEach(t => { if(groups[groups.length-1] !== t.date) groups.push(t.date); });
    const lastIsUndated = rows.length ? (und.length ? rows[rows.length-1].date == null : true) : false;
    return {pass: desc && groups.length > 1 && lastIsUndated,
      lines:[["month shown", monthLabel(ym) + " · " + rows.length + " entries"],
        ["first day groups", groups.slice(0,4).map(d => dateLabel(d)).join("  ›  ")],
        ["order", desc ? "newest dated day first" : "out of order"],
        ["each day header", "shows that day's total"],
        ["last group", und.length ? "Date not specified (" + und.length + ")" : "oldest day"]]};
  }}
];
function scenarioSheet(){
  openSheet({title:"Acceptance scenarios", key:"sc", body:() => {
    const done = Object.keys(scRes).length, passed = Object.values(scRes).filter(r => r.pass).length;
    return `
    <p class="sm">Each one changes the live sample data and reports the figures it measured.
      Reset the demo whenever you want a clean slate.</p>
    ${done ? `<div class="note ${passed === done ? "good" : "bad"}">
      <b>${passed} of ${done} run ${passed === done ? "passed" : "— check the failures"}</b>
      <span>Scenarios run so far in this session.</span></div>` : ""}
    <div class="grid2">
      <button class="btn sm" style="width:100%" data-act="runall">Reset and run all 9</button>
      <button class="btn alt sm" style="width:100%" data-act="reset">Reset demo data</button>
    </div>
    ${SCENARIOS.map(s => {
      const r = scRes[s.n];
      return `<div class="sc ${r ? (r.pass ? "pass" : "fail") : ""}">
        <div class="sch"><span class="scn">${r ? (r.pass ? "✓" : "!") : s.n}</span>
          <span class="sct">${esc(s.t)}</span></div>
        ${r ? `<div class="scout">${r.lines.map(l =>
          `<div>${esc(l[0])}${l[0] ? " — " : ""}<b>${esc(l[1])}</b></div>`).join("")}</div>` : ""}
        <button class="btn alt sm" data-act="runsc" data-n="${s.n}">${r ? "Run again" : "Run"}</button></div>`;
    }).join("")}
    <button class="btn alt" data-act="close">Close</button>`;
  }});
}
/* With your own data loaded, scenarios run on a throwaway sample copy and your
   data is put back untouched afterwards. */
function onSample(fn){
  if(!isReal()) return fn();
  const mine = S; noSave = true;
  try{ S = seed(); return fn(); } finally { S = mine; noSave = false; }
}
function runScenario(n){
  const s = SCENARIOS.find(x => x.n === n);
  onSample(() => { try{ scRes[n] = s.run(); }catch(e){ scRes[n] = {pass:false, lines:[["error", String(e.message||e)]]}; } });
  save(); render(); refresh();
  toast("Scenario " + n + ": " + (scRes[n].pass ? "passed" : "failed"));
}
function runAll(){
  scRes = {};
  onSample(() => {
    if(!isReal()) resetDemo(); else S = seed();
    SCENARIOS.forEach(s => { try{ scRes[s.n] = s.run(); }catch(e){ scRes[s.n] = {pass:false, lines:[["error", String(e.message||e)]]}; } });
  });
  save(); render(); refresh();
  const p = Object.values(scRes).filter(r => r.pass).length;
  toast(p + " of " + SCENARIOS.length + " scenarios passed.");
}

/* ===========================================================================
   10. WIRING
   =========================================================================== */
const fx = () => `<div id="fx">${effectStrip() || '<p class="sm">Enter an amount to see the effect.</p>'}</div>`;

/* Actions that change the figures; a linked sheet catches up shortly after. */
const CHANGES = new Set(["saveexp","saveinc","savemove","savepay","saveedit","deltxn","savebill","savenewbill",
  "savechk","togprot","togsave","savetgt","cleartgt","savegoal"]);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if(CHANGES.has(a) && isReal()) setTimeout(scheduleSync, 0);
  const top = stack[stack.length-1];
  switch(a){
    case "close": closeSheet(); break;
    case "go": screenName = el.dataset.screen; if(el.dataset.filter) actFilter = el.dataset.filter;
      actMonth = null; closeSheet(stack.length); render(); window.scrollTo(0,0); break;
    case "primary": S.primary = v; save(); render(); if(stack.length) refresh(); break;
    case "theme": {
      const dark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      S.theme = dark ? "dark" : "light"; save(); render(); break; }
    case "math": mathSheet(); break;
    case "clock": clockSheet(); break;
    case "day": S.today = addDays(S.today, +el.dataset.d); save(); render(); refresh(); break;
    case "jump": S.today = v; save(); render(); refresh(); break;
    case "guide": guideSheet(); break;
    case "aisnap": aiSheet(); break;
    case "setup": startSetup(); break;
    case "setupadd":
      if(el.dataset.list === "accounts") setup.accounts.push({name:"", kind:"bank", bal:"", prot:false, save:false});
      else if(el.dataset.list === "cards") setup.cards.push({name:"", owed:"", due:"", payFrom:0});
      else setup.bills.push({name:"", amount:"", due:""});
      refresh(); break;
    case "setupdel": setup[el.dataset.list].splice(+el.dataset.i, 1); refresh(); break;
    case "setuptog": { const x = setup.accounts[+el.dataset.i]; x[el.dataset.key] = !x[el.dataset.key]; refresh(); break; }
    case "setupgo": finishSetup(); break;
    case "erase":
      if(!eraseArmed){ eraseArmed = true; render();
        setTimeout(() => { if(eraseArmed){ eraseArmed = false; render(); } }, 5000); break; }
      eraseArmed = false; S = Object.assign(seed(), {theme:S.theme}); save(); scRes = {}; screenName = "home"; render();
      toast("Your data is erased from this phone and the sample is back. Your Google Sheet is untouched."); break;
    case "mksheet": createSheet(); break;
    case "usesheet": {
      const sid = sheetIdFrom(document.getElementById("sheetlink").value);
      if(!sid){ toast("That does not look like a Google Sheet link."); break; }
      S.sheet = {id:sid, url:sheetUrl(sid)}; S.autoSync = true; save(); render(); syncSheet(); break; }
    case "syncnow": syncSheet(); break;
    case "autosync": S.autoSync = S.autoSync === false; save(); render(); break;
    case "unlink": S.sheet = null; syncMsg = {text:"", tone:""}; save(); render();
      toast("Unlinked. The sheet stays in your Drive with the last figures."); break;
    case "aicopy": {
      const ta = document.getElementById("aitext");
      const done = () => toast("Snapshot copied. Paste it into ChatGPT or Claude.");
      const manual = () => { ta.focus(); ta.select(); toast("Selected — tap Copy to copy it."); };
      try{ navigator.clipboard.writeText(ta.value).then(done, manual); }catch(e){ manual(); }
      break; }
    case "scenarios": scenarioSheet(); break;
    case "runsc": runScenario(+el.dataset.n); break;
    case "runall": runAll(); break;
    case "reset": resetDemo(); scRes = {}; screenName = "home"; closeSheet(stack.length); render();
      toast("Sample data and the demo date are back to the start."); break;
    case "filter": actFilter = v; render(); break;
    case "month": actMonth = addMonths(actMonth || S.today.slice(0,7), +el.dataset.d); render(); break;
    case "acct": acctSheet(id); break;
    case "payable": payableSheet(id); break;
    case "txn": txnSheet(id); break;
    case "log": logSheet(); break;
    case "new":
      closeSheet(stack.length);
      ({expense:startExpense, income:startIncome, transfer:startTransfer, cardpay:startCardPay})[el.dataset.kind]();
      break;
    case "scan": scanSheet(); break;
    case "manual": closeSheet(); expenseForm(); break;
    case "confirmscan": draft.confirmed = !draft.confirmed; refresh(); break;
    case "preset":
      if(v === "withdraw") Object.assign(draft, {from:defMain(), to:defCash(), note:"ATM withdrawal"});
      else Object.assign(draft, {from:defMain(), to:defSave(), note:"Monthly savings"});
      refresh(); break;
    /* pickers */
    case "pick": if(top && top.onPick) top.onPick(v); break;
    case "pickmonth": pickMonth(); break;
    case "pickday": pickDay(); break;
    case "daytoday": draft.date = S.today; draft.month = S.today.slice(0,7); if(draft.scan) delete draft.scan.date; refresh(); break;
    case "dayunknown": draft.date = null; if(draft.scan) delete draft.scan.date; refresh(); break;
    case "jumpundated": {
      const u = document.getElementById("undated");
      if(u) window.scrollTo({top: u.getBoundingClientRect().top + window.scrollY - 60,
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      break; }
    case "pickcat": pickCat(); break;
    case "picktype": pickType(); break;
    case "pickmerch": pickMerch(); break;
    case "pickpay": pickPay(); break;
    case "pickacct": listSheet("Account", acctOpts(), draft.acct,
      x => { draft.acct = x; closeSheet(); }); break;
    case "pickfrom": listSheet("From", acctOpts(), draft.from,
      x => { draft.from = x; closeSheet(); }); break;
    case "pickto": listSheet("To", acctOpts(), draft.to,
      x => { draft.to = x; closeSheet(); }); break;
    case "pickgacct": listSheet("Into which account",
      S.accounts.filter(x => x.save).map(x => ({v:x.id, label:x.name})), draft.gacct,
      x => { draft.gacct = x; closeSheet(); }); break;
    case "pickcard": listSheet("Card", S.cards.map(k => ({v:k.id, label:k.name,
      right:peso(balances(null).cards[k.id]) + " owed"})), draft.card,
      x => { draft.card = x; draft.amount = String(balances(null).cards[x] || ""); closeSheet(); }); break;
    case "pickpayfrom": {
      const k = card(draft.card);
      listSheet("Pay from", acctOpts(), k.payFrom, x => { k.payFrom = x; save(); closeSheet(); });
      break; }
    case "payfrom": {
      const k = card(id);
      listSheet("Pay " + k.name + " from", acctOpts(), k.payFrom,
        x => { k.payFrom = x; save(); closeSheet(stack.length); render();
          toast("Planned payment account changed. No money moved."); },
        `<p class="sm">Where you plan to pay this card from. Choosing it transfers nothing.</p>`);
      break; }
    case "paycard": closeSheet(stack.length); startCardPay(id); break;
    case "addmerch": {
      const inp = document.getElementById("newmerch");
      const name = (inp.value || "").trim();
      if(!name) { toast("Type a merchant name first."); break; }
      S.merchants[draft.type] = S.merchants[draft.type] || [];
      if(!S.merchants[draft.type].includes(name)) S.merchants[draft.type].push(name);
      draft.merch = name; save(); closeSheet();
      toast(name + " added. It will be offered for " + draft.type + " next time.");
      break; }
    /* saving */
    case "saveexp":
      if(draft.billId){ const p = S.payables.find(x => x.id === draft.billId); if(p) p.paid = true; }
      saveExpense(); break;
    case "saveinc": saveIncome(); break;
    case "savemove": saveMove(); break;
    case "savepay": saveCardPay(); break;
    case "saveedit": saveEdit(); break;
    case "deltxn": S.txns = S.txns.filter(t => t.id !== id); save();
      closeSheet(stack.length); render(); toast("Entry deleted. Figures recalculated."); break;
    case "savebill": {
      const p = S.payables.find(x => x.id === id);
      const raw = (document.getElementById("billamt").value || "").trim();
      p.amount = raw === "" ? null : r2(+raw);
      if(p.amount != null) delete p.reason;
      save(); closeSheet(stack.length); render();
      toast(p.amount == null ? "Left unknown — kept out of the figures." : "Bill amount saved. Spendable recalculated.");
      break; }
    case "paybill": payBill(id); break;
    case "addbill": openSheet({title:"Add a bill", key:"addbill", body:() => `
      <label class="f"><span class="flab">What is it <span class="req">required</span></span>
        <input class="inp" id="bn" placeholder="Tuition, insurance…"></label>
      <label class="f"><span class="flab">Amount — leave blank if not known yet</span>
        <span class="amtbox"><span>₱</span><input class="num" id="ba" inputmode="decimal" placeholder="unknown"></span></label>
      <label class="f"><span class="flab">Due date</span>
        <input class="inp num" id="bd" type="date" value="${S.today}"></label>
      <button class="btn" data-act="savenewbill">Add bill</button>
      <button class="btn alt" data-act="close">Cancel</button>`}); break;
    case "savenewbill": {
      const n = (document.getElementById("bn").value || "").trim();
      if(!n){ toast("Give the bill a name."); break; }
      const amt = (document.getElementById("ba").value || "").trim();
      S.payables.push({id:"p" + (S.nextId++), name:n, amount:amt === "" ? null : r2(+amt),
        due:document.getElementById("bd").value || S.today, paid:false,
        reason:amt === "" ? "Amount not known yet" : undefined});
      save(); closeSheet(stack.length); render(); toast("Bill added."); break; }
    case "savechk": {
      const raw = (document.getElementById("chk").value || "").trim();
      if(raw === ""){ toast("Enter what the account really says."); break; }
      const have = balances(null).acc[id], diff = r2(+raw - have);
      if(near(diff,0)){ toast("Already matches — no checkpoint needed."); break; }
      commit({kind:"checkpoint", amount:diff, date:S.today, month:S.today.slice(0,7), acct:id,
        note:"Reconciled to " + peso(+raw)});
      closeSheet(stack.length); render();
      toast("Checkpoint saved: " + signed(diff) + ". Past entries untouched.");
      break; }
    case "togprot": { const x = acct(id); x.prot = !x.prot; save(); render(); refresh(); break; }
    case "togsave": { const x = acct(id); x.save = !x.save; save(); render(); refresh(); break; }
    case "smode": S.savings.mode = v; save(); render(); break;
    case "starget": targetSheet(); break;
    case "saccts": acctsSheet(); break;
    case "savetgt": { const raw = (document.getElementById("tgt").value || "").trim();
      S.savings.target = raw === "" ? null : r2(+raw); save(); closeSheet(stack.length); render();
      toast("Savings recommendation set to " + peso(calc().savingsTarget) + "."); break; }
    case "cleartgt": S.savings.target = null; save(); closeSheet(stack.length); render();
      toast("Back to " + Math.round(SAVE_RATE*100) + "% of income received."); break;
    case "addgoal": draft = {gacct:defSave()}; addGoalSheet(); break;
    case "savegoal": {
      const amt = r2(+(document.getElementById("ga").value || 0));
      if(!(amt > 0)){ toast("Enter an amount."); break; }
      const to = draft.gacct || defSave();
      S.goalLog.push({id:"g" + (S.nextId++), date:S.today, amount:amt, acct:to});
      commit({kind:"transfer", amount:amt, date:S.today, month:S.today.slice(0,7), from:defMain(), to,
        note:S.savings.goal.name});
      closeSheet(stack.length); render();
      toast(peso(amt) + " added to " + S.savings.goal.name + ". Recorded as a transfer, not income.");
      break; }
  }
});
/* Merchant search filters the list in place, so the field keeps focus. */
document.addEventListener("input", e => {
  if(e.target.id !== "newmerch") return;
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".sheet .srow").forEach(r => {
    const hit = !q || r.textContent.toLowerCase().includes(q);
    r.hidden = !hit; if(hit) shown++;
  });
  const none = document.getElementById("nomerch");
  if(none) none.hidden = !(q && shown === 0);
});
document.addEventListener("input", setupInput);
document.addEventListener("change", setupInput);
/* Keep the draft in step without re-rendering the field being typed in. */
document.addEventListener("input", e => {
  const f = e.target.dataset.f;
  if(!f || !draft) return;
  draft[f] = e.target.value;
  const host = document.querySelector(".sheet .sin");
  if(!host) return;
  const strip = host.querySelector("#fx");
  if(strip) strip.innerHTML = effectStrip() || '<p class="sm">Enter an amount to see the effect.</p>';
  const btn = host.querySelector("[data-act^='save']");
  if(btn && draft.kind && !draft.editing) btn.disabled = !canSave(draft);
});
/* Repaint on blur so the funding warning catches up — but not while a button is being
   pressed: repainting would swap the button out from under the tap, and its own action
   repaints anyway. */
let pressing = false;
document.addEventListener("pointerdown", e => { pressing = !!e.target.closest("[data-act]"); }, true);
document.addEventListener("click", () => { pressing = false; }, true);
document.addEventListener("pointercancel", () => { pressing = false; }, true);
document.addEventListener("change", e => { if(e.target.dataset.f && draft && !pressing) refresh(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && stack.length) closeSheet(); });

/* ---- boot ---------------------------------------------------------------- */
if(S.theme) document.documentElement.dataset.theme = S.theme;
document.querySelectorAll("[data-ico]").forEach(el => { el.innerHTML = icon(el.dataset.ico, +el.dataset.size || 22); });
render();
